<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafıza Akademi - Öğrenci Koçluk ve Takip Sistemi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Iconları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Giriş Ekranı Kartı -->
    <div id="login-screen" class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">Hafıza Akademi</h1>
            <p class="text-slate-400 text-sm mt-1">Öğrenci Koçluk ve Takip Sistemi</p>
        </div>

        <form id="login-form" onsubmit="girisYap(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Öğrenci Adı Soyadı</label>
                <input type="text" id="ogrenci-adi" placeholder="Örn: Ahmet Yılmaz" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Özel Şifreniz</label>
                <input type="password" id="ogrenci-sifresi" placeholder="Şifrenizi giriniz" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>
            <div id="error-msg" class="text-red-400 text-sm text-center hidden"></div>
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-blue-600/30">
                Sisteme Giriş Yap
            </button>
        </form>
    </div>

    <!-- Sistem Paneli (Giriş Yapılınca Görünecek Alan) -->
    <div id="dashboard-screen" class="hidden w-full max-w-4xl bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <div>
                <h2 id="welcome-title" class="text-xl font-bold text-blue-400">Hoş Geldin, Öğrenci</h2>
                <p class="text-xs text-slate-400">Hafıza Akademi Başarı Takip Paneli</p>
            </div>
            <button onclick="cikisYap()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-lg text-sm transition border border-red-600/30">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Çıkış Yap
            </button>
        </div>

        <!-- Öğrenci İçeriği / Ödevler / Takip Alanı -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-700">
                <h3 class="font-semibold text-lg mb-2 text-blue-300"><i class="fa-solid fa-list-check mr-2"></i>Bu Haftanın Görevleri</h3>
                <p class="text-sm text-slate-400">Ödev durumların ve koçluk notların burada listelenecektir.</p>
            </div>
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-700">
                <h3 class="font-semibold text-lg mb-2 text-emerald-300"><i class="fa-solid fa-chart-line mr-2"></i>Gelişim Raporu</h3>
                <p class="text-sm text-slate-400">Deneme netlerin ve soru çözüm istatistiklerin.</p>
            </div>
        </div>
    </div>

    <script>
        // BURAYA ÖĞRENCİLERİN İSİMLERİNİ VE ÖZEL ŞİFRELERİNİ YAZABİLİRSİN
        const ogrenciVeritabani = {
            "mustafa":"hafiza2026"
            "ahmet yılmaz": "1234",
            "zeynep kaya": "5678",
            "mehmet demir": "9876"
            // Buraya istediğin kadar öğrenci ekleyebilirsin (İsimler hep küçük harf olmalı)
        };

        function girisYap(event) {
            event.preventDefault();
            
            const girilenAd = document.getElementById("ogrenci-adi").value.trim().toLowerCase();
            const girilenSifre = document.getElementById("ogrenci-sifresi").value.trim();
            const errorDiv = document.getElementById("error-msg");

            if (ogrenciVeritabani[girilenAd] && ogrenciVeritabani[girilenAd] === girilenSifre) {
                // Giriş Başarılı
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("dashboard-screen").classList.remove("hidden");
                
                // İlk harfleri büyük yazdırarak karşılama yapalım
                let formatliAd = girilenAd.replace(/\b\w/g, l => l.toUpperCase());
                document.getElementById("welcome-title").innerText = "Hoş Geldin, " + formatliAd;
                errorDiv.classList.add("hidden");
            } else {
                // Giriş Başarısız
                errorDiv.innerText = "Hatalı öğrenci adı veya şifre! Lütfen kontrol edin.";
                errorDiv.classList.remove("hidden");
            }
        }

        function cikisYap() {
            document.getElementById("login-screen").classList.remove("hidden");
            document.getElementById("dashboard-screen").classList.add("hidden");
            document.getElementById("ogrenci-adi").value = "";
            document.getElementById("ogrenci-sifresi").value = "";
        }
    </script>
</body>
</html>
